<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Zen Hardin's 1st Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="apple-touch-icon" href="favicon.jpg">
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        body { overflow: auto; }
        .admin-page {
            min-height: 100vh;
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }
        .stat-card {
            background: white;
            padding: 1.2rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .stat-card h3 { font-size: 0.8rem; opacity: 0.7; text-transform: uppercase; }
        .stat-card p { font-size: 1.5rem; font-weight: 600; color: var(--color-primary); }

        @media (max-width: 768px) {
            .admin-page { padding: 2rem 1rem; }
            .admin-header { text-align: center; justify-content: center; }
            .category-header h2 { font-size: 1.1rem; }
            th, td { padding: 0.8rem 0.5rem; font-size: 0.85rem; }
            .badge { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
        }

        .controls-row {
            display: flex; gap: 1rem; margin-bottom: 2rem; align-items: center; flex-wrap: wrap;
        }
        .search-container { flex: 1; min-width: 300px; }
        .search-input {
            width: 100%; padding: 1rem 1.5rem; border-radius: 15px; border: 1px solid #ddd;
            font-family: var(--font-body); font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .category-group {
            background: white; border-radius: 20px; margin-bottom: 1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden;
        }
        .category-header {
            padding: 1.5rem 2rem; cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; background: #fff; transition: background 0.3s; user-select: none;
        }
        .category-header:hover { background: #fcf8f4; }
        .category-header h2 { font-family: var(--font-heading); font-size: 1.4rem; margin: 0; color: var(--color-primary); }
        .category-content { padding: 0 2rem 1.5rem; display: none; }
        .category-group.open .category-content { display: block; }
        .category-group.open .category-header { border-bottom: 1px solid #f0f0f0; }
        .chevron {
            width: 10px; height: 10px; border-top: 2px solid var(--color-primary);
            border-right: 2px solid var(--color-primary); transform: rotate(135deg); transition: transform 0.3s;
        }
        .category-group.open .chevron { transform: rotate(-45deg); }

        .log-table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 1rem; border-bottom: 1px solid #f0f0f0; }
        th { font-family: var(--font-heading); color: var(--color-primary); font-size: 1rem; cursor: pointer; }
        .sort-icon { font-size: 0.8rem; margin-left: 5px; opacity: 0.5; }
        tr:hover { background: #fafafa; }
        .badge { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .badge-yes { background: #e6fffa; color: #2d6a4f; }
        .badge-no { background: #fff5f5; color: #c53030; }
        .badge-none { background: #f7fafc; color: #4a5568; }

        .btn-clear {
            background: #fff5f5; color: #c53030; border: 1px solid #feb2b2;
            padding: 0.5rem 1rem; border-radius: 10px; cursor: pointer; transition: all 0.3s;
        }
        .btn-clear:hover { background: #feb2b2; color: white; }
        .btn-download {
            background: #eef7ff; color: #24507a; border: 1px solid #b6d4fe;
            padding: 0.5rem 1rem; border-radius: 10px; cursor: pointer; transition: all 0.3s;
        }
        .btn-download:hover { background: #b6d4fe; color: white; }
    </style>
</head>
<body>
    <div id="sparkles-container"></div>
    <div class="admin-page">
        <div class="admin-header fade-in">
            <div>
                <h1 style="font-family: var(--font-heading); color: var(--color-secondary);">RSVP Logs Dashboard</h1>
                <p>Welcome, Admin Joms</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button id="download-pdf" class="btn-download">Download PDF</button>
                <button id="clear-logs" class="btn-clear">Clear Data</button>
                <button onclick="window.location.href='index.html'" class="btn-secondary">Logout</button>
            </div>
        </div>

        <div class="stats-grid fade-in" style="animation-delay: 0.2s;">
            <div class="stat-card"><h3>Total Guests</h3><p id="stat-total">0</p></div>
            <div class="stat-card"><h3>Responded</h3><p id="stat-responded">0</p></div>
            <div class="stat-card"><h3>Attending</h3><p id="stat-attending" style="color: #2d6a4f;">0</p></div>
            <div class="stat-card"><h3>Bringing Car</h3><p id="stat-car">0</p></div>
        </div>

        <div class="controls-row fade-in" style="animation-delay: 0.3s;">
            <div class="search-container"><input type="text" id="guest-search" class="search-input" placeholder="Search guest name..."></div>
        </div>

        <div id="category-logs-container" class="fade-in" style="animation-delay: 0.4s;"></div>
    </div>

    <script>
        const API_URL = '/api/rsvps';

        const GUEST_DATABASE = {
            "Gilda Mendoza": { category: "Lola" }, "Noemi Nacion": { category: "Lola" }, "Ana Lisa Dimingo": { category: "Lola" },
            "Noeda Cañon": { category: "Lola" }, "Nerry Bernardo": { category: "Lola" }, "Agnes Nacion": { category: "Lola" },
            "Jose Mendoza": { category: "Lolo" }, "Noriel Bernardo": { category: "Lolo" }, "Zaldy Cañon": { category: "Lolo" },
            "Jaffy Jurado": { category: "Lolo" },
            "Jennifer Mendoza": { category: "Mommy" }, "Jomel Nacion": { category: "Daddy" },
            "Melissa Mendoza": { category: "Tita" }, "Jovilyn Martirez": { category: "Tita" }, "Henny Tagle": { category: "Tita" },
            "Jona Beltran": { category: "Tita" }, "Rochel Bautista": { category: "Tita" }, "Janine Farmis": { category: "Tita" },
            "Lisa Nacion": { category: "Tita" }, "Shai Rocero": { category: "Tita" }, "Mary Grace Mendoza": { category: "Tita" },
            "Joyce Ortega": { category: "Tita" }, "Aerylle Diez": { category: "Tita" },
            "Mark Garais": { category: "Tito" }, "Jake Cañon": { category: "Tito" },
            "Rhad Oliveros": { category: "Tito" }, "Kingbezar ezar": { category: "Tito" },
            "Shane Tagle": { category: "Ate" }, "Justine Eliza Nacion": { category: "Ate" },
            "Teo Tagle": { category: "Kuya" }, "Gypsy Kaye Pineda": { category: "Ninang" }, "April Nacion": { category: "Ninang" }, "Jonalyn Nacion": { category: "Ninang" },
            "Mary Jane Nacion": { category: "Ninang" }, "Joice Nacion": { category: "Ninang" }, "Rialyn Baarde": { category: "Ninang" },
            "Jezel Lopez Bertanico": { category: "Ninang" }, "Nicole Canon": { category: "Ninang" }, "Maureen Bernardo": { category: "Ninang" },
            "Shiela Tagle": { category: "Ninang" }, "Camille Leodones": { category: "Ninang" }, "Louise Mae Tolentino": { category: "Ninang" },
            "Laudette Alvarez": { category: "Ninang" }, "Maricris Gelsano": { category: "Ninang" }, "Marimar Quiazon": { category: "Ninang" },
            "Rho-Ann Paloma": { category: "Ninang" }, "Romina Medel": { category: "Ninang" }, "Charise Payawal": { category: "Ninang" },
            "Josephine Mendoza": { category: "Ninang" }, "Nikki Raynera": { category: "Ninang" }, "Camilla Berbano": { category: "Ninang" },
            "Mike Blacer": { category: "Ninang" }, "Iralyn Mendones": { category: "Ninang" }, "Krisha Banez": { category: "Ninang" },
            "Nelsi Asperas": { category: "Ninang" }, "Jerie Nacion": { category: "Ninong" }, "Joseph Mendoza": { category: "Ninong" },
            "Kurt Nacion": { category: "Ninong" }, "Jc Canon": { category: "Ninong" }, "Nathaniel Bernardo": { category: "Ninong" },
            "Ryan Francis Nacion": { category: "Ninong" }, "Romulo Ian Nacion": { category: "Ninong" }, "James Tagle": { category: "Ninong" },
            "Karlo Quesada": { category: "Ninong" }, "Cedric Nacion": { category: "Ninong" }, "Sammy Buendia": { category: "Ninong" },
            "John Christoffer Tolentino": { category: "Ninong" }, "Eleazar Ang": { category: "Ninong" }, "Arnold Denosta": { category: "Ninong" },
            "Ariel Acosta": { category: "Ninong" },
            "Boss bam": { category: "Ninong" }, "Prince babar": { category: "Ninong" }, "Pj ezar": { category: "Ninong" },
            "Jec mendoza": { category: "Ninong" }, "Toby yañga": { category: "Ninong" }, "Mark Benedict Cruz": { category: "Ninong" },
            "JR Habitan": { category: "Ninong" }, "Tevince Cludel": { category: "Ninong" }
        };

        let currentSearch = "";
        let currentSort = { column: 'name', direction: 'asc' };
        let exportRows = [];

        function getAttendingPriority(status) {
            if (status === 'Yes') return 1;
            if (!status) return 2;
            return 3;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function buildGuestRows(rsvpRows) {
            const rsvpData = {};
            rsvpRows.forEach(row => {
                rsvpData[row.guest_name] = row;
            });

            return Object.keys(GUEST_DATABASE).map(name => {
                const guest = GUEST_DATABASE[name];
                const rsvp = rsvpData[name];

                return {
                    name,
                    category: guest.category,
                    attending: rsvp?.attending || '',
                    car: rsvp?.car || '',
                    wish: rsvp?.wish || '',
                    timestamp: rsvp?.created_at ? new Date(rsvp.created_at).toLocaleString() : ''
                };
            });
        }

        function downloadPdfReport() {
            if (!window.jspdf?.jsPDF) {
                alert('PDF library failed to load. Please refresh and try again.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'a4' });
            const margin = 40;
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const usableWidth = pageWidth - (margin * 2);
            const categoryWidth = 90;
            const nameWidth = 170;
            const wishWidth = usableWidth - categoryWidth - nameWidth;
            const lineHeight = 16;
            let y = margin;

            const rows = [...exportRows].sort((a, b) => {
                const categoryCompare = a.category.localeCompare(b.category);
                return categoryCompare !== 0 ? categoryCompare : a.name.localeCompare(b.name);
            });

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(18);
            doc.text("Zen Hardin's Birthday Guest Wishes", margin, y);
            y += 24;

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.text(`Generated: ${new Date().toLocaleString()}`, margin, y);
            y += 22;

            const drawHeader = () => {
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(11);
                doc.text('Category', margin, y);
                doc.text('Name', margin + categoryWidth, y);
                doc.text('Wish', margin + categoryWidth + nameWidth, y);
                y += 10;
                doc.line(margin, y, pageWidth - margin, y);
                y += 16;
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
            };

            drawHeader();

            rows.forEach(row => {
                const wishLines = doc.splitTextToSize(row.wish || '-', wishWidth);
                const rowHeight = Math.max(lineHeight, wishLines.length * lineHeight);

                if (y + rowHeight > pageHeight - margin) {
                    doc.addPage();
                    y = margin;
                    drawHeader();
                }

                doc.text(row.category, margin, y);
                doc.text(row.name, margin + categoryWidth, y);
                doc.text(wishLines, margin + categoryWidth + nameWidth, y);
                y += rowHeight + 8;
            });

            doc.save('zen-birthday-wishes.pdf');
        }

        async function renderLogs() {
            try {
                const response = await fetch(API_URL);
                const rsvpRows = await response.json();
                const allRows = buildGuestRows(rsvpRows);
                exportRows = allRows;

                const container = document.getElementById('category-logs-container');
                container.innerHTML = '';
                const categories = {};
                let total = 0, responded = 0, attendingCount = 0, carCount = 0;

                allRows.forEach(row => {
                    total++;
                    if (row.attending) {
                        responded++;
                        if (row.attending === 'Yes') {
                            attendingCount++;
                            if (row.car === 'Yes') carCount++;
                        }
                    }
                    if (currentSearch && !row.name.toLowerCase().includes(currentSearch.toLowerCase())) return;
                    if (!categories[row.category]) categories[row.category] = [];
                    categories[row.category].push(row);
                });

                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-responded').innerText = responded;
                document.getElementById('stat-attending').innerText = attendingCount;
                document.getElementById('stat-car').innerText = carCount;

                Object.keys(categories).sort().forEach(catName => {
                    const guests = categories[catName];
                    guests.sort((a, b) => {
                        let vA = a[currentSort.column] || "", vB = b[currentSort.column] || "";
                        if (currentSort.column === 'attending') { vA = getAttendingPriority(a.attending); vB = getAttendingPriority(b.attending); }
                        return (vA < vB ? -1 : vA > vB ? 1 : 0) * (currentSort.direction === 'asc' ? 1 : -1);
                    });

                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'category-group' + (currentSearch ? ' open' : '');
                    groupDiv.innerHTML = `
                        <div class="category-header"><h2>${catName} (${guests.length})</h2><div class="chevron"></div></div>
                        <div class="category-content"><div class="log-table-container"><table><thead><tr>
                            <th onclick="changeSort('name')">Name ${getSortIcon('name')}</th>
                            <th onclick="changeSort('attending')">Attending ${getSortIcon('attending')}</th>
                            <th onclick="changeSort('car')">Car ${getSortIcon('car')}</th>
                            <th>Wish</th>
                            <th onclick="changeSort('timestamp')">Date ${getSortIcon('timestamp')}</th>
                        </tr></thead><tbody>
                            ${guests.map(g => `<tr>
                                <td><strong>${escapeHtml(g.name)}</strong></td>
                                <td>${renderBadge(g.attending)}</td>
                                <td>${escapeHtml(g.car || (g.attending === 'Yes' ? 'No' : '-'))}</td>
                                <td style="font-size: 0.9rem; max-width: 250px; font-style: italic;">${escapeHtml(g.wish || '-')}</td>
                                <td style="font-size: 0.8rem; opacity: 0.7;">${escapeHtml(g.timestamp || '-')}</td>
                            </tr>`).join('')}
                        </tbody></table></div></div>`;
                    groupDiv.querySelector('.category-header').addEventListener('click', () => groupDiv.classList.toggle('open'));
                    container.appendChild(groupDiv);
                });
            } catch (error) {
                console.error('Fetch Error:', error);
            }
        }

        function renderBadge(att) {
            if (att === 'Yes') return '<span class="badge badge-yes">Coming</span>';
            if (att === 'No') return '<span class="badge badge-no">Not Coming</span>';
            return '<span class="badge badge-none">Pending</span>';
        }

        function getSortIcon(col) {
            if (currentSort.column !== col) return '↕';
            return currentSort.direction === 'asc' ? '↑' : '↓';
        }

        function changeSort(col) {
            if (currentSort.column === col) currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            else { currentSort.column = col; currentSort.direction = 'asc'; }
            renderLogs();
        }

        document.getElementById('guest-search').addEventListener('input', (e) => { currentSearch = e.target.value; renderLogs(); });
        document.getElementById('download-pdf').addEventListener('click', downloadPdfReport);
        document.getElementById('clear-logs').addEventListener('click', async () => {
            if (confirm('Clear all data from database?')) {
                try {
                    const response = await fetch(API_URL, { method: 'DELETE' });
                    if (!response.ok) throw new Error('Failed to clear data');
                    renderLogs();
                } catch (error) {
                    alert('Error clearing data: ' + error.message);
                }
            }
        });
        renderLogs();
    </script>
    <script src="script.js"></script>
</body>
</html>
